name: Windows installer
on: [workflow_dispatch]
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - name: Build self-contained installer
        shell: powershell
        run: ./packaging/windows/build.ps1
      - name: Install and run without Python on PATH
        shell: powershell
        run: ./packaging/windows/smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Afinario-windows-x64
          path: |
            dist/installers/*
            reports/installer-*
