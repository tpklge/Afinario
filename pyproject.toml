[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "afinario"
version = "0.1.0"
description = "Inventário e reconhecimento musical com interface desktop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx==0.28.1", "platformdirs==4.13.6", "mutagen==1.48.1", "keyring==25.7.0"]

[project.urls]
Repository = "https://github.com/tpklge/Afinario"

[project.optional-dependencies]
recognition = ["shazamio==0.9.0"]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
gui = ["PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0"]
gui-test = ["PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0", "pytest-qt==4.5.0"]

[project.scripts]
afinario = "afinario.cli:main"

[project.gui-scripts]
afinario-desktop = "afinario.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/afinario"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
